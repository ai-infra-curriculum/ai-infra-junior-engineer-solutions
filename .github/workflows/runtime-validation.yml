name: Runtime Validation

# Adds kubectl / terraform / docker smoke validation on top of the
# main ``ci.yml`` workflow. Kept in a separate file to avoid bloating
# the existing CI and so it can be triggered independently.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubectl-dryrun:
    name: kubectl apply --dry-run=client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubeconform is the canonical offline manifest validator:
      # `kubectl apply --dry-run=client` still drives the three-way-merge
      # logic that needs API discovery, and it cannot resolve third-party
      # CRDs (ServiceMonitor, VerticalPodAutoscaler, ...) without a live
      # cluster — which is why every manifest (built-in and CRD alike) was
      # being rejected. kubeconform tolerates unknown CRDs via
      # --ignore-missing-schemas and runs fully offline.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          KC_VERSION=v0.6.7
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tgz
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Validate every Kubernetes manifest
        shell: bash
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          candidates=(
            projects/**/k8s/**/*.yaml
            projects/**/k8s/**/*.yml
            projects/**/kubernetes/**/*.yaml
            projects/**/kubernetes/**/*.yml
            projects/**/manifests/**/*.yaml
            projects/**/manifests/**/*.yml
            modules/**/k8s/**/*.yaml
            modules/**/k8s/**/*.yml
            modules/**/kubernetes/**/*.yaml
            modules/**/kubernetes/**/*.yml
          )
          files=()
          for pattern in "${candidates[@]}"; do
            for f in $pattern; do
              base="$(basename "$f")"
              case "$base" in
                kustomization.yaml|Chart.yaml|values.yaml|values-*.yaml)
                  continue
                  ;;
              esac
              files+=("$f")
            done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Kubernetes manifests found; nothing to validate."
            exit 0
          fi
          fails=0
          for f in "${files[@]}"; do
            if ! kubeconform -ignore-missing-schemas -summary -output text "$f"; then
              echo "::error file=$f::kubeconform rejected manifest"
              fails=$((fails+1))
            fi
          done
          echo "Validated ${#files[@]} manifest(s); ${fails} rejection(s)."
          exit "$fails"

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Run terraform validate in every Terraform module
        shell: bash
        run: |
          set -uo pipefail
          tf_dirs=()
          while IFS= read -r dir; do
            tf_dirs+=("$dir")
          done < <(find projects modules -type f -name '*.tf' -printf '%h\n' 2>/dev/null | sort -u)
          if [ ${#tf_dirs[@]} -eq 0 ]; then
            echo "No Terraform modules found; nothing to validate."
            exit 0
          fi
          fails=0
          for dir in "${tf_dirs[@]}"; do
            echo "=== terraform validate: $dir ==="
            if ! ( cd "$dir" && terraform init -backend=false -input=false >/dev/null 2>&1 \
                   && terraform validate -no-color ); then
              echo "::error file=$dir::terraform validate failed"
              fails=$((fails+1))
            fi
          done
          echo "Validated ${#tf_dirs[@]} Terraform module(s); ${fails} failure(s)."
          exit "$fails"

  docker-build-smoke:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # `docker buildx build --check` runs the BuildKit frontend's
      # parse + lint phase and stops before executing any RUN/COPY
      # step or pulling the base image. That's exactly the right shape
      # for a smoke test against this repo's Dockerfiles: several of
      # them sit on top of multi-gigabyte GPU base images
      # (nvcr.io/nvidia/pytorch, nvidia/cuda + pinned TensorRT libs)
      # whose full builds aren't feasible on a vanilla CI runner, and
      # several intentionally split context across `docker/` siblings
      # via docker-compose (so `dirname $df` isn't the real build
      # context). `--check` catches Dockerfile-level mistakes — bad
      # syntax, unknown instructions, malformed FROM lines — without
      # tripping on either limitation.
      - name: Lint every Dockerfile (smoke)
        shell: bash
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          dockerfiles=(
            projects/**/Dockerfile
            projects/**/Dockerfile.*
            modules/**/Dockerfile
            modules/**/Dockerfile.*
          )
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo "No Dockerfiles found; nothing to smoke-build."
            exit 0
          fi
          fails=0
          for df in "${dockerfiles[@]}"; do
            ctx="$(dirname "$df")"
            echo "=== docker buildx --check: $df ==="
            if ! docker buildx build \
                --progress=plain \
                --check \
                --file "$df" \
                "$ctx"; then
              echo "::error file=$df::docker buildx --check failed"
              fails=$((fails+1))
            fi
          done
          echo "Smoke-checked ${#dockerfiles[@]} Dockerfile(s); ${fails} failure(s)."
          exit "$fails"
